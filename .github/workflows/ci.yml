name: Application checks
on:
  pull_request:
    branches:
      - develop
      - 'feature/**'
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  backend-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - name: Check authored model and generated documentation
        run: |
          python3 -m venv "$RUNNER_TEMP/pdd-venv"
          "$RUNNER_TEMP/pdd-venv/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/pdd-venv/bin/python" tools/plan-driven-development/scripts/check_project.py validate project.yaml
          "$RUNNER_TEMP/pdd-venv/bin/python" tools/plan-driven-development/scripts/check_project.py audit-preservation project.yaml --root .
          "$RUNNER_TEMP/pdd-venv/bin/python" tools/plan-driven-development/scripts/check_project.py audit-task-status docs/task/README.md
          "$RUNNER_TEMP/pdd-venv/bin/python" tools/pdd/check-migration.py
          "$RUNNER_TEMP/pdd-venv/bin/python" tools/pdd/render.py --check
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --watchAll=false --runInBand
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
