tasks:
  - id: TASK-001
    title: Scaffold the backend database layer and control framework
    requirement_ids:
      - FR-SYS-06
      - NFR-SEC-02
      - NFR-SEC-08
      - NFR-REL-05
      - NFR-PERF-02
      - NFR-COMP-02
      - NFR-MNT-01
      - NFR-MNT-02
      - NFR-MNT-04
      - NFR-MNT-05
    component_ids:
      - CMP-DATA
      - CMP-PLATFORM
      - CMP-CONTROL
    decision_ids:
      - D-001
      - D-002
      - D-003
      - D-004
      - D-005
      - D-006
      - D-007
      - D-008
    depends_on: []
    acceptance_ids:
      - AC-SYS-06-1
      - AC-SYS-06-2
      - AC-NFR-SEC-02-4
      - AC-NFR-SEC-08-1
      - AC-NFR-REL-05-1
      - AC-NFR-PERF-02-1
      - AC-NFR-COMP-02-1
      - AC-NFR-MNT-01-1
      - AC-NFR-MNT-01-2
      - AC-NFR-MNT-02-1
      - AC-NFR-MNT-04-1
      - AC-NFR-MNT-05-1
    objective: The repository contains the accepted WDP database layer, an empty module skeleton that boots, and the plan-driven
      control artifacts.
    in_scope:
      - Copy all Mongoose schemas, database configuration, seed data, the data migration script and its chat-encryption helper
        from the baseline
      - Stub every baseline route, controller, service, middleware and utility file
      - Harden create-admin and seed scripts
      - Create plan.md, project.yaml, docs, .agent and .project control files
    out_of_scope:
      - Any business endpoint or service logic
      - Frontend code
      - Running scripts against MongoDB (TASK-002)
    inputs:
      - plan.md#4.13 Scheduled jobs and data operations
      - plan.md#5. Quality requirements
      - docs/technical/architecture.md
      - docs/technical/data-model.md
    outputs:
      - backend/src/modules/*/*.model.js
      - backend/src/config/
      - backend/src/seeds/
      - backend/src/app.js
      - backend/src/routes.js
      - backend/src/server.js
      - backend/tests/scaffold.test.js
      - plan.md
      - project.yaml
      - docs/
      - .agent/
      - .project/
    invariants:
      - INV-05
      - INV-06
      - INV-08
    verification_commands:
      - cd backend && npm test
    stop_conditions:
      - A required decision is not accepted
      - A needed schema change has no approved schema-change task (D-003)
      - Verification cannot run or produces no original output
    technical_approach: Copy schemas byte-for-byte except documented script fixes; stubs export empty objects or empty routers
      so the route map in routes.js mounts every module prefix.
    baseline_refs:
      - WDP@1cea2b7:backend/src/modules/*/*.model.js
      - WDP@1cea2b7:backend/src/seeds/
      - WDP@1cea2b7:backend/create-admin.js
  - id: TASK-002
    title: Verify database scripts against MongoDB
    requirement_ids:
      - FR-SYS-06
      - NFR-PERF-02
    component_ids:
      - CMP-DATA
    decision_ids:
      - D-003
    depends_on:
      - TASK-001
    acceptance_ids:
      - AC-SYS-06-3
      - AC-NFR-PERF-02-2
    objective: Seed, verification, index and admin scripts are proven on a real MongoDB instance.
    in_scope:
      - Run npm run seed, seed:verify, db:indexes and create-admin against a disposable MongoDB (replica set recommended)
      - Store the original console output as evidence
    out_of_scope:
      - Schema changes
    inputs:
      - plan.md#4.13 Scheduled jobs and data operations
      - plan.md#5. Quality requirements
      - docs/technical/architecture.md
      - docs/technical/data-model.md
      - TASK-001 evidence
    outputs:
      - .project/evidence/TASK-002/
