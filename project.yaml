# SecondSafe structured project model (plan-driven-development schema_version 1).
# Authority: requirement, decision and task definitions. Intent lives in plan.md; execution state in .project/state.json.
# Validate: python3 tools/plan-driven-development/scripts/check_project.py validate project.yaml
schema_version: 1
project:
  id: secondsafe
  name: SecondSafe
  plan_file: plan.md
  repository: https://github.com/Lecoeurdelest/SecondSafe
  summary: Second-hand marketplace with a React web client, escrow-protected API, dispute handling and moderation.
preservation:
  baselines:
    - id: BASE-WDP
      source: https://github.com/Trungnc273/WDP
      revision: 1cea2b7fc673619f19e9bf76eb745e0e44cc50c1
    - id: BASE-TRACKING
      source: Project Tracking workbook WDP_FR_NFR_Tracking.xlsx (FR, NFR, Defects tabs)
      revision: '2026-09-24'
    - id: BASE-PDD
      source: https://github.com/Lecoeurdelest/plan-driven-development
      revision: 41c1bd8ec495524656369a95c126bc09bf465896
    - id: BASE-SECONDSAFE
      source: https://github.com/Lecoeurdelest/SecondSafe
      revision: 5ed8be5
  artifacts:
    - id: ART-SCHEMAS
      path: backend/src/modules/*/*.model.js
      role: Accepted MongoDB schema contract
      disposition: preserve
      baseline: BASE-WDP
    - id: ART-DB-CONFIG
      path: backend/src/config/db.js
      role: Database connection
      disposition: preserve
      baseline: BASE-WDP
    - id: ART-ENV-CONFIG
      path: backend/src/config/env.js
      role: Environment configuration
      disposition: preserve
      baseline: BASE-WDP
    - id: ART-CHAT-CRYPTO
      path: backend/src/common/utils/chat-crypto.util.js
      role: Message content encryption at rest
      disposition: preserve
      baseline: BASE-WDP
    - id: ART-SEEDS
      path: backend/src/seeds/*.seed.js
      role: Seed data
      disposition: enhance
      baseline: BASE-WDP
      note: Seed functions no longer exit the process when imported; productsData is exported for offline validation; the
        sample seller password comes from SEED_SELLER_PASSWORD.
    - id: ART-SEED-ALL
      path: backend/seed-all.js
      role: Seed runner
      disposition: enhance
      baseline: BASE-WDP
    - id: ART-VERIFY-SEED
      path: backend/verify-seed-data.js
      role: Seed verification
      disposition: preserve
      baseline: BASE-WDP
    - id: ART-MIGRATE
      path: backend/migrate-data-consistency.js
      role: Data consistency migration
      disposition: preserve
      baseline: BASE-WDP
    - id: ART-INDEXES
      path: backend/create-indexes.js
      role: Index creation script
      disposition: enhance
      baseline: BASE-WDP
      note: Creates indexes for every registered model instead of three.
    - id: ART-CREATE-ADMIN
      path: backend/create-admin.js
      role: Initial admin creation
      disposition: enhance
      baseline: BASE-WDP
      note: Credentials come from the environment; no hardcoded password.
    - id: ART-MODULE-LAYOUT
      path: backend/src/modules/*/*.route.js
      role: Baseline module and route file layout
      disposition: enhance
      baseline: BASE-WDP
    - id: ART-REQUIREMENT-IDS
      path: docs/requirements/*.md
      role: FR/NFR IDs from the tracking workbook
      disposition: preserve
      baseline: BASE-TRACKING
    - id: ART-TASK-SPECS
      path: docs/task/TASK-*.md
      role: Task specifications replacing baseline logic
      disposition: enhance
      baseline: BASE-PDD
    - id: ART-TASK-INDEX
      path: docs/task/README.md
      role: Visible three-marker task index
      disposition: enhance
      baseline: BASE-PDD
    - id: ART-BASELINE-LOGIC
      path: backend/src/modules/*/*.service.js
      role: Baseline business logic
      disposition: supersede
      baseline: BASE-WDP
      approval: 'User request 2026-09-24: backend logic left empty and rebuilt through tasks'
      replacement_ids:
        - ART-TASK-SPECS
    - id: ART-BASELINE-FRONTEND
      path: frontend/**
      role: Baseline React frontend
      disposition: enhance
      baseline: BASE-WDP
      previous_disposition: remove
      previous_approval: 'User request 2026-09-24: backend skeleton only'
      note: Frontend migration restored by user request 2026-10-09 (D-009); the earlier backend-only scaffold history remains intact.
  conventions:
    - Requirement IDs from the tracking workbook (FR-<MODULE>-NN, NFR-<GROUP>-NN) are never renumbered; new requirements take
      the next free number.
    - Task IDs TASK-NNN are never renumbered; replaced tasks are superseded, not deleted.
    - Each task has one specification in docs/task and, once completed, one implementation record in docs/implement.
    - The visible task index projects execution as [], [!] or [x]; relevance is a separate column.
    - Mongoose schemas change only through an explicit task with a migration note (D-003).
    - Every commit is authored and committed by Lecoeurdelest without co-author trailers (D-007).
  status_dimensions:
    - execution
    - relevance
  approval_required_for:
    - remove
    - semantic_change
    - authority_change
components:
  - id: CMP-CONTROL
    title: Plan-driven control artifacts
  - id: CMP-DATA
    title: MongoDB schemas, seeds and data scripts
  - id: CMP-PLATFORM
    title: HTTP platform, configuration and cross-cutting concerns
  - id: CMP-AUTH
    title: Identity and access
  - id: CMP-USERS
    title: User profiles
  - id: CMP-CATALOG
    title: Listings, categories, search and favorites
  - id: CMP-CHAT
    title: Conversations and real-time messaging
  - id: CMP-WALLET
    title: Wallet, payment gateways and escrow
  - id: CMP-ORDERS
    title: Purchase requests and orders
  - id: CMP-DELIVERY
    title: Delivery tracking
  - id: CMP-REVIEWS
    title: Reviews and ratings
  - id: CMP-TRUST
    title: Violation reports and disputes
  - id: CMP-NOTIFY
    title: Notifications and email
  - id: CMP-MODERATION
    title: Moderator console
  - id: CMP-ADMIN
    title: Administration
  - id: CMP-JOBS
    title: Scheduled jobs
  - id: CMP-WEB
    title: React marketplace web client
decisions:
  - id: D-001
    title: 'Stack: Node.js 18+, Express 4, MongoDB with Mongoose 8, CommonJS, Jest and Supertest'
    status: accepted
    source: User request 2026-09-24 (backend skeleton from WDP); WDP package.json
  - id: D-002
    title: Repository scope is the backend only; the frontend is out of scope
    status: superseded
    superseded_by: D-009
    source: User request 2026-09-24 ("khung backend")
  - id: D-003
    title: The WDP Mongoose schemas are the accepted database contract; schema changes need an explicit task with a migration
      note
    status: accepted
    source: User request 2026-09-24 ("Chỉ bao gồm phần DB"); answer "Schema + config + seed + index"
  - id: D-004
    title: Baseline business logic is not carried; every route, controller, service and middleware starts as an empty stub
    status: accepted
    source: User request 2026-09-24 ("backend để rỗng hết"); answer "Giữ cấu trúc module, file stub rỗng"
  - id: D-005
    title: Engineering artifacts are written in English; user-facing API messages remain Vietnamese
    status: accepted
    source: User answer 2026-09-24 ("English"); product language inferred from the WDP baseline
  - id: D-006
    title: plan-driven-development (pinned revision) is the control framework; project.yaml owns requirement and task definitions
    status: accepted
    source: User request 2026-09-24
  - id: D-007
    title: Lecoeurdelest is the only author and committer; commits carry no co-author trailers
    status: accepted
    source: User request 2026-09-24
  - id: D-008
    title: API prefixes follow the baseline (/api/<module>) so a WDP-compatible client can reconnect
    status: accepted
    source: Approved skeleton keeps baseline module routers and mount paths (backend/src/routes.js)
  - id: D-101
    title: 'Two-factor login: keep as a per-user opt-in or retire FR-AUTH-04'
    status: proposed
    source: Tracking sheet decision list item 2
    options:
      - Keep as opt-in per user
      - Retire FR-AUTH-04
    recommendation: Keep as opt-in per user
  - id: D-102
    title: 'VNPay: keep alongside SePay or retire FR-PAY-04'
    status: proposed
    source: Tracking sheet decision list item 2
    options:
      - Keep VNPay
      - Retire VNPay; SePay only
    recommendation: Retire VNPay; SePay only
  - id: D-103
    title: 'Listings: publish immediately or require moderator approval before publishing'
    status: proposed
    source: Tracking sheet decision list item 1
    options:
      - Publish immediately (baseline)
      - Moderator approval first
    recommendation: Publish immediately (baseline)
  - id: D-104
    title: Payment window after order confirmation (baseline 3 minutes)
    status: proposed
    source: Tracking sheet decision list item 3
    options:
      - 3 minutes (baseline)
      - 15 minutes
      - 30 minutes
    recommendation: 15 minutes
    note: 'Non-blocking: the value is configuration (NFR-BIZ-02); TASK-004 keeps the baseline default until accepted.'
  - id: D-105
    title: Withdrawal approval owner
    status: proposed
    source: Tracking sheet decision list item 4
    options:
      - Admin only
      - Moderator only
      - Admin and moderator through one flow
    recommendation: Admin and moderator through one flow
  - id: D-106
    title: Partial refunds in dispute resolution
    status: proposed
    source: Tracking sheet decision list item 5
    options:
      - Implement partial_refund
      - Remove partial_refund from the enum
    recommendation: Implement partial_refund
  - id: D-107
    title: Listing expiry handling after the maximum age
    status: proposed
    source: Tracking sheet defect DEF-13
    options:
      - Soft expire (status expired)
      - Hard delete (baseline)
    recommendation: Soft expire (status expired)
  - id: D-108
    title: Shared store (for example Redis) for one-time codes, rate limits and socket presence
    status: proposed
    source: NFR-REL-04
    options:
      - Single instance, in-memory adapter
      - Shared Redis adapter
    recommendation: Single instance, in-memory adapter until horizontal scaling is needed
    note: 'Non-blocking: tasks implement a store interface with an in-memory adapter.'
  - id: D-109
    title: Token revocation and refresh strategy
    status: proposed
    source: FR-AUTH-08, NFR-SEC-03
    options:
      - Stateless JWT, client discards on logout (baseline)
      - Short access token plus refresh token with revocation
    recommendation: Stateless JWT (baseline) for the first release
    note: 'Non-blocking: TASK-005 and TASK-012 keep the baseline behavior.'
  - id: D-009
    title: Migrate both frontend and backend from WDP through small tracked tasks
    status: accepted
    source: 'User request 2026-10-09: migrate WDP into SecondSafe, including FE and BE tasks'
    supersedes:
    - D-002
  - id: D-010
    title: Adapt WDP implementations to SecondSafe requirements and fix reviewed defects before acceptance
    status: accepted
    source: User migration request 2026-10-09; preserves D-003 schemas and existing criteria
  - id: D-011
    title: Gitflow delivery uses main, develop and task-scoped feature branches and review slices; all new authors and
      committers are Lecoeurdelest
    status: accepted
    source: 'User request 2026-10-09: Gitflow, self-service PR creation, sole user authorship'
invariants:
  - id: INV-01
    statement: 'Money is never created or lost: every balance change writes a transaction with balance before and after, and
      each escrow hold is released or refunded at most once.'
  - id: INV-02
    statement: A listing has at most one active order and is reserved while that order is open.
  - id: INV-03
    statement: A seller under selling restriction cannot create listings, offers or seller-side orders, and their active listings
      are hidden.
  - id: INV-04
    statement: Admin accounts are never suspended, restricted, locked or deleted by platform rules.
  - id: INV-05
    statement: Order-scoped data (order, delivery, dispute, conversation, evidence) is visible only to the order parties,
      moderators and admins.
  - id: INV-06
    statement: Passwords exist only as bcrypt hashes and never leave the service.
  - id: INV-07
    statement: Order status changes only along the documented lifecycle edges.
  - id: INV-08
    statement: All amounts are integer VND.
requirements:
  - id: FR-AUTH-01
    title: Register with email verification
    kind: functional
    risk: standard
    component: CMP-AUTH
    source:
      file: plan.md
      section: 4.1 Identity and access
    baseline_api:
      - POST /api/auth/register/request-otp
      - POST /api/auth/register/verify
    acceptance:
      - id: AC-AUTH-01-1
        statement: Registration code requests without email, password, full name or phone, with a malformed email, with a
          phone not matching ^0\d{9,10}$, or with an email or phone already registered are rejected with 400.
        verification: &id001
          - behavioral_test
      - id: AC-AUTH-01-2
        statement: The password must satisfy the strong password policy (NFR-SEC-02) before a code is sent.
        verification: *id001
      - id: AC-AUTH-01-3
        statement: A 6-digit code is emailed, expires after the configured OTP lifetime (default 5 minutes) and can be used
          once.
        verification: *id001
      - id: AC-AUTH-01-4
        statement: The account (role user, bcrypt-hashed password) is created only when the submitted code matches; no user
          document exists before verification.
        verification: &id002
          - static_flow
          - behavioral_test
  - id: FR-AUTH-02
    title: Log in with email and password
    kind: functional
    risk: critical
    component: CMP-AUTH
    source:
      file: plan.md
      section: 4.1 Identity and access
    baseline_api:
      - POST /api/auth/login
    acceptance:
      - id: AC-AUTH-02-1
        statement: Valid credentials return a signed JWT (configured lifetime, default 7 days) and the user profile without
          the password.
        verification: *id001
      - id: AC-AUTH-02-2
        statement: An unknown email and a wrong password produce the same 401 response.
        verification: *id001
      - id: AC-AUTH-02-3
        statement: 'Suspension state is disclosed only after the password is verified: an active suspension returns 403 with
          end time and reason; an expired suspension is lifted automatically.'
        verification: *id002
  - id: FR-AUTH-03
    title: Sign in with Google
    kind: functional
    risk: standard
    component: CMP-AUTH
    source:
      file: plan.md
      section: 4.1 Identity and access
    baseline_api:
      - POST /api/auth/google
    acceptance:
      - id: AC-AUTH-03-1
        statement: The Firebase ID token is verified server-side; invalid or expired tokens return 401.
        verification: *id001
      - id: AC-AUTH-03-2
        statement: A first-time Google email creates a user with role user, a random strong password, and the Google name
          and avatar.
        verification: *id001
      - id: AC-AUTH-03-3
        statement: Existing users pass through the same suspension and selling-restriction checks as password login.
        verification: *id001
  - id: FR-AUTH-04
    title: Two-factor login (optional)
    kind: functional
    risk: standard
    component: CMP-AUTH
    source:
      file: plan.md
      section: 4.1 Identity and access
    baseline_api:
      - POST /api/auth/login/verify-2fa
    acceptance:
      - id: AC-AUTH-04-1
        statement: For a user with two-factor login enabled, a correct password returns requires2FA and emails a 6-digit code
          instead of a token.
        verification: *id001
      - id: AC-AUTH-04-2
        statement: POST /api/auth/login/verify-2fa issues the token only for a valid, unexpired code with purpose login_2fa.
        verification: *id001
  - id: FR-AUTH-05
    title: Recover a forgotten password
    kind: functional
    risk: critical
    component: CMP-AUTH
    source:
      file: plan.md
      section: 4.1 Identity and access
    baseline_api:
      - POST /api/auth/forgot-password
    acceptance:
      - id: AC-AUTH-05-1
        statement: POST /api/auth/forgot-password returns the same response whether or not the email is registered.
        verification: *id001
      - id: AC-AUTH-05-2
        statement: The stored password hash does not change until the requester proves control of the email with an expiring
          one-time code or signed reset credential (lifetime at most 1 hour).
        verification: *id002
      - id: AC-AUTH-05-3
        statement: After a successful reset, a security notification is created for the account.
        verification: *id001
  - id: FR-AUTH-06
    title: Reset the password with a verified credential
    kind: functional
    risk: critical
    component: CMP-AUTH
    source:
      file: plan.md
      section: 4.1 Identity and access
    baseline_api:
      - POST /api/auth/reset-password
    acceptance:
      - id: AC-AUTH-06-1
        statement: POST /api/auth/reset-password accepts only a valid, unexpired, unused credential issued by the recovery
          flow and sets a password that satisfies the strong policy.
        verification: *id002
  - id: FR-AUTH-07
    title: Change password
    kind: functional
    risk: standard
    component: CMP-AUTH
    source:
      file: plan.md
      section: 4.1 Identity and access
    baseline_api:
      - POST /api/auth/change-password
      - POST /api/users/change-password
    acceptance:
      - id: AC-AUTH-07-1
        statement: A wrong current password returns 400 and leaves the stored hash unchanged.
        verification: *id001
      - id: AC-AUTH-07-2
        statement: The new password must satisfy the strong password policy.
        verification: *id001
      - id: AC-AUTH-07-3
        statement: Both baseline paths are served by one handler.
        verification: &id003
          - static_flow
  - id: FR-AUTH-08
    title: Log out
    kind: functional
    risk: standard
    component: CMP-AUTH
    source:
      file: plan.md
      section: 4.1 Identity and access
    baseline_api:
      - POST /api/auth/logout
    acceptance:
      - id: AC-AUTH-08-1
        statement: 'POST /api/auth/logout returns 200 for an authenticated user; server-side token handling follows decision
          D-109 (baseline: the client discards the token).'
        verification: *id001
  - id: FR-AUTH-09
    title: Role-based access control
    kind: functional
    risk: critical
    component: CMP-AUTH
    source:
      file: plan.md
      section: 4.1 Identity and access
    baseline_api:
      - auth / role / admin middleware
    acceptance:
      - id: AC-AUTH-09-1
        statement: Protected endpoints return 401 without a valid Bearer token and 403 when the caller role is not allowed.
        verification: *id001
      - id: AC-AUTH-09-2
        statement: Moderator endpoints accept moderator and admin; admin endpoints accept admin only.
        verification: *id001
  - id: FR-AUTH-10
    title: Enforce suspension and selling restriction on every request
    kind: functional
    risk: critical
    component: CMP-AUTH
    source:
      file: plan.md
      section: 4.1 Identity and access
    baseline_api:
      - auth.middleware.js
      - seller-restriction.util.js
    acceptance:
      - id: AC-AUTH-10-1
        statement: An authenticated request from a suspended account returns 403 until the suspension ends; expired suspensions
          are lifted automatically.
        verification: *id001
      - id: AC-AUTH-10-2
        statement: While a selling restriction is active, the seller's active listings are hidden and seller actions return
          403; an expired restriction is cleared automatically.
        verification: *id001
      - id: AC-AUTH-10-3
        statement: Suspension and restriction rules live in one shared service used by login, Google sign-in and the authentication
          middleware.
        verification: *id003
  - id: FR-PROF-01
    title: View own profile
    kind: functional
    risk: standard
    component: CMP-USERS
    source:
      file: plan.md
      section: 4.2 Profiles
    baseline_api:
      - GET /api/users/profile
      - GET /api/auth/profile
    acceptance:
      - id: AC-PROF-01-1
        statement: Both profile paths return the caller's profile from one handler, without the password.
        verification: *id001
  - id: FR-PROF-02
    title: Update profile
    kind: functional
    risk: standard
    component: CMP-USERS
    source:
      file: plan.md
      section: 4.2 Profiles
    baseline_api:
      - PUT /api/users/profile
    acceptance:
      - id: AC-PROF-02-1
        statement: Full name must be 2–80 characters, phone must match ^0\d{9,10}$ and be unused by another account, and address
          must be at most 255 characters; violations return 400.
        verification: *id001
      - id: AC-PROF-02-2
        statement: Structured location (city, district, ward, specific address) is stored with the profile.
        verification: *id001
  - id: FR-PROF-03
    title: Update avatar
    kind: functional
    risk: standard
    component: CMP-USERS
    source:
      file: plan.md
      section: 4.2 Profiles
    baseline_api:
      - POST /api/users/avatar
    acceptance:
      - id: AC-PROF-03-1
        statement: POST /api/users/avatar stores a path produced by the upload pipeline and rejects any other value with 400.
        verification: *id001
  - id: FR-PROF-04
    title: Public profile and statistics
    kind: functional
    risk: standard
    component: CMP-USERS
    source:
      file: plan.md
      section: 4.2 Profiles
    baseline_api:
      - GET /api/users/:id/public
      - GET /api/users/:id/stats
    acceptance:
      - id: AC-PROF-04-1
        statement: Public profile and statistics are available without authentication and never expose email, phone, address
          or wallet data.
        verification: *id001
  - id: FR-PROD-01
    title: Create a listing
    kind: functional
    risk: standard
    component: CMP-CATALOG
    source:
      file: plan.md
      section: 4.3 Listings and catalog
    baseline_api:
      - POST /api/products
    acceptance:
      - id: AC-PROD-01-1
        statement: Title (≤200 characters), description (≤2000), price (integer VND ≥0), at least one category, condition
          (new, like-new, good, fair, poor), at least one image, city and district are required; violations return 400.
        verification: *id001
      - id: AC-PROD-01-2
        statement: An optional other-category label is limited to 100 characters.
        verification: *id001
      - id: AC-PROD-01-3
        statement: A seller under selling restriction receives 403.
        verification: *id001
      - id: AC-PROD-01-4
        statement: A valid listing is published with status active (unless decision D-103 introduces pre-publication moderation).
        verification: *id001
  - id: FR-PROD-02
    title: Upload listing images
    kind: functional
    risk: standard
    component: CMP-CATALOG
    source:
      file: plan.md
      section: 4.3 Listings and catalog
    baseline_api:
      - POST /api/upload/image
      - POST /api/upload/images
    acceptance:
      - id: AC-PROD-02-1
        statement: Image uploads accept jpg, jpeg, png and gif up to 5 MB each and at most 5 files per request, stored under
          random file names.
        verification: *id001
  - id: FR-PROD-03
    title: Edit a listing
    kind: functional
    risk: standard
    component: CMP-CATALOG
    source:
      file: plan.md
      section: 4.3 Listings and catalog
    baseline_api:
      - PUT /api/products/:id
    acceptance:
      - id: AC-PROD-03-1
        statement: Only the owner can edit; a sold listing, a reserved listing or a listing linked to an active order cannot
          be edited.
        verification: *id001
  - id: FR-PROD-04
    title: Delete a listing
    kind: functional
    risk: standard
    component: CMP-CATALOG
    source:
      file: plan.md
      section: 4.3 Listings and catalog
    baseline_api:
      - DELETE /api/products/:id
    acceptance:
      - id: AC-PROD-04-1
        statement: Only the owner can delete, under the same state rules as editing; deletion sets status deleted instead
          of removing the document.
        verification: *id001
  - id: FR-PROD-05
    title: Hide or show a listing
    kind: functional
    risk: standard
    component: CMP-CATALOG
    source:
      file: plan.md
      section: 4.3 Listings and catalog
    baseline_api:
      - PATCH /api/products/:id/visibility
    acceptance:
      - id: AC-PROD-05-1
        statement: The owner toggles active and hidden; a restricted seller cannot re-activate; deleted, sold and reserved
          listings cannot change visibility.
        verification: *id001
  - id: FR-PROD-06
    title: List my listings
    kind: functional
    risk: standard
    component: CMP-CATALOG
    source:
      file: plan.md
      section: 4.3 Listings and catalog
    baseline_api:
      - GET /api/products/my-products
    acceptance:
      - id: AC-PROD-06-1
        statement: GET /api/products/my-products returns the caller's listings filtered by status, paginated (default 20,
          maximum 100).
        verification: *id001
  - id: FR-PROD-07
    title: View listing detail
    kind: functional
    risk: standard
    component: CMP-CATALOG
    source:
      file: plan.md
      section: 4.3 Listings and catalog
    baseline_api:
      - GET /api/products/:id
    acceptance:
      - id: AC-PROD-07-1
        statement: The detail returns the listing with a seller summary and returns 404 when the seller is deleted or suspended.
        verification: *id001
  - id: FR-PROD-09
    title: Pre-publication listing moderation
    kind: functional
    risk: standard
    component: CMP-CATALOG
    source:
      file: plan.md
      section: 4.3 Listings and catalog
    baseline_api:
      - moderationStatus field in product.model.js (unused in baseline)
